name: 🚀 Deploy InstaGrab

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger 

env:
  NODE_VERSION: '20'

jobs:
  # ─── Step 1: Test Backend ───
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

  # ─── Step 2: Build Frontend ───
  build-frontend:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api

  # ─── Step 3: Deploy to AWS EC2 ───
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Setup Node.js for Deployment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare Backend Environment
        id: prep_env
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          if [ -n "$BACKEND_ENV" ]; then
            B64=$(node -e 'console.log(Buffer.from(process.env.BACKEND_ENV).toString("base64"))')
            echo "has_env=true" >> "$GITHUB_OUTPUT"
            echo "env_b64=$B64" >> "$GITHUB_OUTPUT"
          else
            echo "has_env=false" >> "$GITHUB_OUTPUT"
            echo "env_b64=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/instagrab

            # ──── Pull latest code ────
            echo "📥 Pulling latest changes..."
            git pull origin main

            # ──── Write Backend .env from GitHub Secrets if configured ────
            if [ "${{ steps.prep_env.outputs.has_env }}" = "true" ]; then
              echo "🔒 Writing backend/.env from GitHub Secrets..."
              echo "${{ steps.prep_env.outputs.env_b64 }}" | base64 -d > backend/.env
              chmod 600 backend/.env
              echo "✅ backend/.env updated securely from GitHub Secrets."
            else
              echo "ℹ️  BACKEND_ENV secret not set in GitHub; preserving existing backend/.env on server."
            fi

            # ──── Write Frontend .env.local ────
            if [ ! -f "frontend/.env.local" ]; then
              echo "⚙️ Writing frontend/.env.local..."
              echo "NEXT_PUBLIC_API_URL=/api" > frontend/.env.local
            fi

            # ──── Backend ────
            echo "📦 Installing backend dependencies..."
            cd backend
            npm install
            npm run build
            cd ..

            # ──── Frontend ────
            echo "📦 Installing frontend dependencies..."
            cd frontend
            npm install
            NEXT_PUBLIC_API_URL=/api npm run build
            cd ..

            # ──── Update yt-dlp to latest binary ────
            echo "📥 Updating yt-dlp to latest release..."
            sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
            sudo chmod a+rx /usr/local/bin/yt-dlp
            echo "yt-dlp: $(yt-dlp --version)"

            # ──── Restart PM2 ────
            echo "🔄 Restarting PM2 processes..."
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save

            echo ""
            echo "================================================"
            echo "✅ Deployment complete!"
            echo "================================================"
            pm2 status
