services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insta-downloader-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FILE_EXPIRATION_MINUTES=30
      - MAX_DOWNLOAD_SIZE_MB=500
      - TEMP_DIR=/app/temp
      - ALLOWED_ORIGINS=http://localhost,http://localhost:3000,http://localhost:80
    volumes:
      - ./cookies:/app/cookies:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insta-downloader-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: insta-downloader-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
